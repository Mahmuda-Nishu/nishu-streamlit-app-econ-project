name: Update BLS Data

on:
  schedule:
    # 10th of every month at 14:00 UTC (after BLS releases the monthly jobs report)
    - cron: "0 14 10 * *"
  workflow_dispatch:  # allows a manual run from the Actions tab

permissions:
  contents: write  # needed to commit the updated CSV

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the latest BLS data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python bls_pipeline.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bls_data.csv
          git diff --cached --quiet || git commit -m "Automated monthly BLS data update"
          git push
